name: WordPress plugin PHP checks
on:
  push:
  pull_request:
jobs:
  php-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Full standalone release preflight
        run: bash news-cache-guard/tools/release-preflight.sh
      - name: Cache probe shell syntax
        run: bash -n news-cache-guard/tools/cache-probe.sh
